[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ams-league-recorder"
version = "0.6.7"
description = "Durable AMS2 shared-memory recorder and batch uploader"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ams-recorder = "ams_recorder.__main__:main"

[project.gui-scripts]
ams-recorder-ui = "ams_recorder.gui:main"

[tool.setuptools.packages.find]
include = ["ams_recorder*"]
