name: Recorder checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 is unavailable on Ubuntu 26.04 (ubuntu-latest).
        os: [ubuntu-24.04, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  windows-executable:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and check the recorder window
        shell: powershell
        run: ./tools/build_windows.ps1
      - name: Prepare download and checksum
        shell: powershell
        run: |
          Copy-Item docs/windows-quickstart.txt dist/README.txt
          $hash = (Get-FileHash dist/AMSLeagueRecorder-Windows-x64-Intel-AMD.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AMSLeagueRecorder-Windows-x64-Intel-AMD.exe" | Out-File dist/AMSLeagueRecorder-Windows-x64-Intel-AMD.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AMSLeagueRecorder-Windows-x64-Intel-AMD
          path: |
            dist/AMSLeagueRecorder-Windows-x64-Intel-AMD.exe
            dist/AMSLeagueRecorder-Windows-x64-Intel-AMD.exe.sha256
            dist/README.txt
          if-no-files-found: error
          retention-days: 90
